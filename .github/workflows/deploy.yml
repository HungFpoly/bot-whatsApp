name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/edwin
            git pull origin main
            npm install
            npm run build || echo "⚠️ Build failed, restarting with previous version..."
            pm2 stop edwin || true
            pm2 delete edwin || true
            pm2 start npm --name edwin --cwd /root/edwin -- start
            pm2 save
            echo "✅ Deployment complete!"
